[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resectionlab"
version = "0.1.0"
description = "Local research workspace for patient-specific glioma route and resection simulation"
requires-python = ">=3.12"
authors = [
  {name = "skamal23", email = "sayemkamal12@gmail.com"},
  {name = "shafsthegoat", email = "shafrir.p@gmail.com"},
]
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "nibabel>=5.3,<6",
  "scikit-image>=0.25,<1",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
rl = ["gymnasium>=1,<2"]
anatomy = ["vtk==9.7.0", "SimpleITK>=2.5,<3", "pydicom>=3,<4", "psutil>=6,<8"]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]
diffusion = ["dipy>=1.12,<1.13", "SimpleITK>=2.5,<3"]
brain-extraction = ["surfa==0.6.3", "xxhash==4.0.1"]
legacy-qt = ["PySide6>=6.8,<7", "vtk>=9.4,<10"]

[project.scripts]
resectionlab-legacy-qt = "resectionlab.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resectionlab = ["surface_policy.json", "surgical_idle_native.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
