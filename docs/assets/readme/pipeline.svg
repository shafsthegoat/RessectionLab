<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fd6c2"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e7b46a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="470" rx="18" fill="#0f1418"/>

  <text x="40" y="52" fill="#e8eef1" font-size="22" font-weight="600">One patient, from scanner to rehearsal</text>
  <text x="40" y="78" fill="#8a9aa3" font-size="14">Every stage runs locally on a laptop. Each view stays linked to the original scan, in millimeters.</text>

  <!-- stage boxes -->
  <g font-size="15">
    <g>
      <rect x="40" y="110" width="200" height="130" rx="12" fill="#161e23" stroke="#2c3a42"/>
      <text x="60" y="142" fill="#7fd6c2" font-size="13" font-weight="600" letter-spacing="1">1 · CASES</text>
      <text x="60" y="168" fill="#e8eef1" font-size="17" font-weight="600">Load the patient</text>
      <text x="60" y="194" fill="#a7b4bb">MRI, CT, CTA, TOF,</text>
      <text x="60" y="214" fill="#a7b4bb">diffusion, annotations</text>
    </g>
    <g>
      <rect x="270" y="110" width="200" height="130" rx="12" fill="#161e23" stroke="#2c3a42"/>
      <text x="290" y="142" fill="#7fd6c2" font-size="13" font-weight="600" letter-spacing="1">2 · SCANS</text>
      <text x="290" y="168" fill="#e8eef1" font-size="17" font-weight="600">Align &amp; inspect</text>
      <text x="290" y="194" fill="#a7b4bb">Registration, linked</text>
      <text x="290" y="214" fill="#a7b4bb">axial/coronal/sagittal</text>
    </g>
    <g>
      <rect x="500" y="110" width="200" height="130" rx="12" fill="#161e23" stroke="#2c3a42"/>
      <text x="520" y="142" fill="#7fd6c2" font-size="13" font-weight="600" letter-spacing="1">3 · ANATOMY</text>
      <text x="520" y="168" fill="#e8eef1" font-size="17" font-weight="600">Build the 3D head</text>
      <text x="520" y="194" fill="#a7b4bb">Skull, brain, vessels,</text>
      <text x="520" y="214" fill="#a7b4bb">tumor, dura, CSF</text>
    </g>
    <g>
      <rect x="730" y="110" width="200" height="130" rx="12" fill="#161e23" stroke="#2c3a42"/>
      <text x="750" y="142" fill="#7fd6c2" font-size="13" font-weight="600" letter-spacing="1">4 · PLAN</text>
      <text x="750" y="168" fill="#e8eef1" font-size="17" font-weight="600">Compare approaches</text>
      <text x="750" y="194" fill="#a7b4bb">Entry points, corridors,</text>
      <text x="750" y="214" fill="#a7b4bb">what each path crosses</text>
    </g>
    <g>
      <rect x="960" y="110" width="200" height="130" rx="12" fill="#161e23" stroke="#7fd6c2"/>
      <text x="980" y="142" fill="#7fd6c2" font-size="13" font-weight="600" letter-spacing="1">5 · REHEARSE</text>
      <text x="980" y="168" fill="#e8eef1" font-size="17" font-weight="600">Operate &amp; replay</text>
      <text x="980" y="194" fill="#a7b4bb">Drill, cut, aspirate,</text>
      <text x="980" y="214" fill="#a7b4bb">scrub, save, reopen</text>
    </g>
  </g>
  <g stroke="#7fd6c2" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="242" y1="175" x2="266" y2="175"/>
    <line x1="472" y1="175" x2="496" y2="175"/>
    <line x1="702" y1="175" x2="726" y2="175"/>
    <line x1="932" y1="175" x2="956" y2="175"/>
  </g>

  <!-- engine band -->
  <rect x="40" y="290" width="760" height="140" rx="12" fill="#121a1f" stroke="#2c3a42"/>
  <text x="60" y="322" fill="#e7b46a" font-size="13" font-weight="600" letter-spacing="1">SURGICAL ENGINE · PYTHON + OPTIONAL C++</text>
  <text x="60" y="350" fill="#e8eef1" font-size="16">Every instrument action is checked against the tissue model, applied,</text>
  <text x="60" y="372" fill="#e8eef1" font-size="16">and recorded. Removed tissue, debris, modeled bleeding and protected-structure</text>
  <text x="60" y="394" fill="#e8eef1" font-size="16">contact are measured. A fresh process replays every state exactly.</text>

  <rect x="830" y="290" width="330" height="140" rx="12" fill="#121a1f" stroke="#2c3a42"/>
  <text x="850" y="322" fill="#e7b46a" font-size="13" font-weight="600" letter-spacing="1">PLANNERS</text>
  <text x="850" y="350" fill="#e8eef1" font-size="16">Search, RL policies and a human</text>
  <text x="850" y="372" fill="#e8eef1" font-size="16">use the same actions, rules and</text>
  <text x="850" y="394" fill="#e8eef1" font-size="16">scoring. LLM agents are next.</text>

  <g stroke="#e7b46a" stroke-width="2" fill="none">
    <line x1="1060" y1="244" x2="1060" y2="286" marker-end="url(#arrowAmber)" marker-start="url(#arrowAmber)"/>
    <line x1="804" y1="360" x2="826" y2="360" marker-end="url(#arrowAmber)" marker-start="url(#arrowAmber)"/>
  </g>
</svg>
